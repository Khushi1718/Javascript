<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Search Gallery</title>
    <style>
        :root {
            --bg-1: #f4f7fb;
            --bg-2: #e9eff8;
            --text-main: #1d2a3a;
            --text-muted: #5f6f84;
            --card-bg: #ffffff;
            --border-soft: #d8e3f3;
            --accent: #1f7ae0;
            --shadow: 0 10px 24px rgba(21, 51, 93, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at top right, #dbe8ff 0%, transparent 40%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2));
            padding: 2rem 1rem 3rem;
        }

        .container {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 0.25rem;
            font-size: clamp(1.5rem, 2.8vw, 2.2rem);
            letter-spacing: 0.3px;
        }

        .subtitle {
            margin: 0 0 1.25rem;
            color: var(--text-muted);
            font-size: 0.98rem;
        }

        .search-wrap {
            margin-bottom: 1.5rem;
        }

        .search-input {
            width: 100%;
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            padding: 0.95rem 1rem;
            font-size: 1rem;
            color: var(--text-main);
            background: #ffffffcc;
            backdrop-filter: blur(3px);
            outline: none;
            box-shadow: 0 4px 14px rgba(41, 76, 117, 0.08);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(31, 122, 224, 0.14);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(220px, 1fr));
            gap: 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transform: translateY(0);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 32px rgba(21, 51, 93, 0.18);
        }

        .card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 0.85rem 0.95rem 1rem;
        }

        .card h3 {
            margin: 0 0 0.4rem;
            font-size: 1.05rem;
        }

        .card p {
            margin: 0;
            color: var(--text-muted);
            line-height: 1.45;
            font-size: 0.92rem;
        }

        .empty-state {
            display: none;
            text-align: center;
            color: var(--text-muted);
            padding: 1rem;
            font-size: 0.95rem;
        }

        @media (max-width: 900px) {
            .card-grid {
                grid-template-columns: repeat(2, minmax(220px, 1fr));
            }
        }

        @media (max-width: 600px) {
            body {
                padding-top: 1.2rem;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Discover Our Creators</h1>
        <p class="subtitle">Search by name or description to quickly find a card.</p>

        <div class="search-wrap">
            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="Search cards..."
                aria-label="Search cards"
            >

        </div>

        <section id="cardGrid" class="card-grid"></section>

        <p id="emptyState" class="empty-state">No cards found for this search.</p>
    </main>

    <script src="proj2.js"></script>
</body>
</html>
